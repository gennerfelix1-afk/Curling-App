<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b1d2a" />
    <title>Curling</title>
  </head>
  <body data-phase="aim" data-menu="open">
    <canvas id="view"></canvas>
    <div id="overlay"></div>
    <div id="tools">
      <button id="btn-camera" title="Kamera wechseln (C)">Kamera: Auto</button>
      <button id="btn-sound" title="Ton an/aus (M)">🔊</button>
    </div>

    <div id="hud">
      <table id="scoreboard"></table>
      <div id="hud-line">
        <span id="hud-team" data-team="0">Rot</span>
        <span id="hud-end"></span>
        <span id="hud-speed"></span>
      </div>
    </div>
    <div id="hud-call"></div>
    <div id="message"></div>

    <div class="panel" id="panel-aim">
      <div class="group">
        <button id="btn-turn-ccw" title="Out-Turn (Q)">↺ Out-Turn</button>
        <button id="btn-turn-cw" title="In-Turn (E)">In-Turn ↻</button>
      </div>
      <div class="group">
        <button id="btn-weight-down" title="leichter (S)">−</button>
        <span id="weight-label"></span>
        <button id="btn-weight-up" title="schwerer (W)">+</button>
      </div>
      <button id="btn-go">Abgabe</button>
      <button id="btn-concede" title="Partie aufgeben">Aufgeben</button>
      <div class="hint">Besen setzen: aufs Eis tippen/ziehen · gestrichelt = geschätzter Weg ohne Wischen</div>
    </div>

    <div class="panel" id="panel-meter">
      <div id="meter-title"></div>
      <div id="meter"><div id="meter-marker"></div></div>
      <button id="btn-cancel">Abbrechen</button>
    </div>

    <div class="panel" id="panel-gesture">
      <div id="gesture-title">Stein nach oben ziehen und vor der roten Hog Line loslassen – gleichmäßig im Tempo, gerade zum Besen</div>
      <div id="pace"><div id="pace-marker"></div><span class="l">zu langsam</span><span class="r">zu schnell</span></div>
      <button id="btn-cancel-gesture">Abbrechen</button>
    </div>

    <div class="panel" id="panel-sweep">
      <button class="pad" id="pad-sweep-0"><span>Wischer 1 (A)</span><div class="fatigue"><i id="fatigue-0"></i></div></button>
      <div id="sides">
        <button id="btn-side-l">◀ links</button>
        <button id="btn-side-c">mittig</button>
        <button id="btn-side-r">rechts ▶</button>
      </div>
      <button class="pad" id="pad-sweep-1"><span>Wischer 2 (D)</span><div class="fatigue"><i id="fatigue-1"></i></div></button>
    </div>
    <button id="pad-skip"></button>

    <div class="panel" id="panel-result">
      <button id="btn-continue">Weiter</button>
    </div>

    <div class="panel" id="panel-decision">
      <div id="decision-text"></div>
      <div id="decision-options"></div>
    </div>

    <div id="menu">
      <div class="card">
        <h1>Curling</h1>
        <label>Ends <select id="opt-ends"><option value="8">8</option><option value="10">10</option></select></label>
        <label>Hammer im 1. End <select id="opt-hammer"><option value="coin">Münzwurf</option><option value="lsd">Last Stone Draw</option></select></label>
        <label>Eis <select id="opt-ice"><option value="keen">keen (schnell)</option><option value="normal" selected>normal</option><option value="heavy">heavy (langsam)</option></select></label>
        <label>Curl <select id="opt-curl"><option value="straight">straight</option><option value="normal" selected>normal</option><option value="swingy">swingy</option></select></label>
        <label>Schwierigkeit <select id="opt-difficulty"><option value="beginner">Anfänger (mit Vorschau-Linie)</option><option value="club">Club</option><option value="pro">Profi</option></select></label>
        <label>Abgabe <select id="opt-delivery"><option value="meter">Timing-Anzeigen</option><option value="gesture">Wisch-Geste</option></select></label>
        <button id="btn-start">Partie starten</button>
        <p>2 Spieler am selben Gerät (Hot-Seat). KI-Gegner folgt.</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
